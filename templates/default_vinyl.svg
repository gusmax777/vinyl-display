<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="grooves" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="40%" stop-color="#181818" />
      <stop offset="42%" stop-color="#0d0d0d" />
      <stop offset="60%" stop-color="#1c1c1c" />
      <stop offset="62%" stop-color="#111" />
      <stop offset="80%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15" />
      <stop offset="50%" stop-color="transparent" stop-opacity="0" />
      <stop offset="100%" stop-color="white" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Außenrand Vinyl -->
  <circle cx="250" cy="250" r="235" fill="url(#grooves)" stroke="#222" stroke-width="4"/>
  
  <!-- Tonrillen-Effekt -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#252525" stroke-width="1.5" stroke-dasharray="12 4" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#222222" stroke-width="1.5" />
  <circle cx="250" cy="250" r="160" fill="none" stroke="#282828" stroke-width="1.5" stroke-dasharray="16 6" />
  <circle cx="250" cy="250" r="135" fill="none" stroke="#222222" stroke-width="1.5" />
  <circle cx="250" cy="250" r="115" fill="none" stroke="#252525" stroke-width="1.5" stroke-dasharray="8 4" />

  <!-- Lichtreflexion -->
  <circle cx="250" cy="250" r="235" fill="url(#sheen)" />

  <!-- Mittellabel (Gold/Bernstein passend zum Akzent) -->
  <circle cx="250" cy="250" r="85" fill="#e5a93b" stroke="#b87f1e" stroke-width="3" />
  <circle cx="250" cy="250" r="80" fill="none" stroke="#caa042" stroke-width="1" />
  
  <!-- Label-Aufschrift -->
  <text x="250" y="225" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#222" text-anchor="middle" letter-spacing="3">VINYL STATION</text>
  <text x="250" y="242" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#444" text-anchor="middle" letter-spacing="1">33 ⅓ RPM • STEREO</text>
  
  <!-- Mittelloch / Spindel -->
  <circle cx="250" cy="250" r="15" fill="#08090b" stroke="#333" stroke-width="2" />
</svg>
